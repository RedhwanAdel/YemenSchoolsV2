<app-page-wrapper
  headerTitle="School List"
  headerSubtitle="Manage all schools registered in the system"
  headerIcon="school"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    routerLink="/dash-board/schools-add"
  >
    <i class="bi bi-plus-lg me-1"></i>
    Create School
  </button>

  <app-table
    [dataRow]="schools"
    [columns]="schoolColumns"
    [totalItems]="totalItems"
    [pageSize]="schoolParams.pageSize"
    [hasActions]="true"
    (pageChange)="onPageChange($event)"
    (actionClicked)="handleUserAction($event)"
    (sortChange)="onSortChange($event)"
  >
  </app-table>
</app-page-wrapper>
