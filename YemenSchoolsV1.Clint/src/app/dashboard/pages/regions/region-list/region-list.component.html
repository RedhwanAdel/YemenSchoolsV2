<app-page-wrapper
  headerTitle="قائمة المناطق"
  headerSubtitle="استعرض المناطق داخل المدن المحددة"
  headerIcon="map"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="openRegionDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    إضافة منطقة
  </button>

  <app-table
    [dataRow]="regionService.regions()"
    [columns]="regionColumns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
