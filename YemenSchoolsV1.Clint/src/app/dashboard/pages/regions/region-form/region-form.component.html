<h2 mat-dialog-title>{{ isEdit ? "تعديل المنطقة" : "إضافة منطقة" }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" mat-dialog-content class="pt-3">
  <app-form-input label="الاسم (بالعربية)" formControlName="nameAr" />
  <app-form-input label="الاسم (بالإنجليزية)" formControlName="nameEn" />
  <app-select-input
    label="المدينة"
    [options]="cityService.cities()"
    labelKey="nameAr"
    valueKey="id"
    formControlName="cityId"
  />
  <app-form-input label="مسار الصورة" formControlName="imagePath" />
</form>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">إلغاء</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="form.invalid"
    (click)="submit()"
  >
    {{ isEdit ? "تحديث" : "إضافة" }}
  </button>
</mat-dialog-actions>
