<app-page-wrapper
  headerTitle="قائمة المدن"
  headerSubtitle="تصفح جميع المدن المتاحة في النظام"
  headerIcon="location_city"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="openCityDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    إضافة مدينة
  </button>

  <app-table
    [dataRow]="cityService.cities()"
    [columns]="cityColumns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
