<div class="w-full flex flex-col mt-5 py-5">
  <!-- Tabs -->
  <mat-tab-group
    [(selectedIndex)]="containerIndex"
    (selectedIndexChange)="onTabChange($event)"
  >
    <mat-tab label="Inbox"></mat-tab>
    <mat-tab label="Outbox"></mat-tab>
  </mat-tab-group>

  <!-- Table -->
  <div class="mt-3">
    <table
      mat-table
      [dataSource]="paginatedMessages()?.data ?? []"
      class="mat-elevation-z2 w-full"
    >
      <!-- Sender / Recipient Column -->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>Sender / Recipient</th>
        <td mat-cell *matCellDef="let message">
          <div class="flex items-center gap-3">
            <img
              class="rounded-full h-12 w-12"
              [src]="
                isInbox
                  ? message.senderImageUrl || '/user.png'
                  : message.recipientImageUrl || '/user.png'
              "
              alt="user image"
            />
            <div>
              {{
                isInbox
                  ? message.senderDisplayName
                  : message.recipientDisplayName
              }}
            </div>
          </div>
        </td>
      </ng-container>

      <!-- Content Column -->
      <ng-container matColumnDef="content">
        <th mat-header-cell *matHeaderCellDef>Message</th>
        <td mat-cell *matCellDef="let message" class="truncate">
          {{ message.content }}
        </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let message">
          {{ message.messageSent | date : "medium" }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let message">
          <button
            mat-icon-button
            color="warn"
            (click)="confirmDelete($event, message.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [class.font-bold]="isInbox && !row.dateRead"
        [routerLink]="
          '/members/' + (isInbox ? row.senderId : row.recipientId) + '/messages'
        "
      ></tr>
    </table>
  </div>

  <!-- Paginator -->
  <mat-paginator
    *ngIf="paginatedMessages()?.metadata?.totalCount"
    [length]="paginatedMessages()?.totalCount || 0"
    [pageSize]="paginatedMessages()?.pageSize || 10"
    [pageIndex]="(paginatedMessages()?.currentPage || 1) - 1"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>
