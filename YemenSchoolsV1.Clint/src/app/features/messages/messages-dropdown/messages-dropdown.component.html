@if (messages() ) {
<div class="w-full flex flex-col p-2">
  <mat-tab-group
    [(selectedIndex)]="containerIndex"
    (selectedIndexChange)="onTabChange($event)"
  >
    <mat-tab label="Inbox"></mat-tab>
    <mat-tab label="Outbox"></mat-tab>
  </mat-tab-group>

  <div class="mt-3">
    <table
      mat-table
      [dataSource]="messages() ?? []"
      class="mat-elevation-z2 w-full"
    >
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let message">
          <div class="d-flex items-center gap-2">
            <img
              width="50px"
              class="rounded-full h-8 w-8"
              src="/assets/images/user/avatar-2.jpg"
              alt="user image"
            />
            <div class="text-xs">
              {{
                isInbox
                  ? message.senderDisplayName
                  : message.recipientDisplayName
              }}
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="content">
        <th mat-header-cell *matHeaderCellDef>Message</th>
        <td mat-cell *matCellDef="let message" class="truncate text-xs">
          {{ message.content }}
        </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let message" class="text-xs">
          {{ message.messageSent | date : "short" }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        style="cursor: pointer"
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        routerLink="/parent-dash-board/teacher-contact/{{
          isInbox ? row.senderId : row.recipientId
        }}"
      ></tr>
    </table>
  </div>
  <div class="flex justify-center mt-2">
    <button mat-flat-button color="primary" routerLink="/messages">
      عرض كل الرسائل
    </button>
  </div>
</div>

}@else {
<p>لا توجد رسائل</p>
}
