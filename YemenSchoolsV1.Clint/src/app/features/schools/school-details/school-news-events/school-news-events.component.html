<div class="container py-4" dir="rtl">
  <h1 class="page-title text-primary-emphasis fw-bold mb-4">
    أخبار وفعاليات أكاديمية الشروق
  </h1>

  <hr />

  <mat-card class="mb-5 shadow-sm">
    <mat-card-content class="p-4">
      <h2 class="section-header">آخر الأخبار والقصص الناجحة 🌟</h2>

      <div class="row g-4">
        <div class="col-sm-6 col-md-4" *ngFor="let newsItem of news">
          <mat-card class="news-card h-100">
            <img
              [src]="newsItem.imageUrl"
              class="news-image"
              [alt]="newsItem.title"
            />

            <mat-card-content class="p-3">
              <span class="news-date mb-1 d-block">{{ newsItem.date }}</span>
              <h3 class="news-title fw-semibold">{{ newsItem.title }}</h3>
              <p class="text-secondary-emphasis mb-3 small-excerpt">
                {{ newsItem.excerpt }}
              </p>

              <mat-card-actions class="p-0">
                <button
                  mat-stroked-button
                  color="primary"
                  class="read-more-btn"
                >
                  قراءة المزيد
                  <mat-icon>chevron_left</mat-icon>
                </button>
              </mat-card-actions>
            </mat-card-content>
          </mat-card>
        </div>
      </div>

      <div class="text-center mt-4">
        <button mat-flat-button color="accent">
          تصفح أرشيف الأخبار بالكامل
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="shadow-sm">
    <mat-card-content class="p-4">
      <h2 class="section-header">الفعاليات القادمة ومواعيد مهمة 📅</h2>

      <mat-list>
        <mat-list-item class="event-item" *ngFor="let event of events">
          <div class="event-date-box me-3">
            <div class="month">{{ event.month }}</div>
            <div class="day fw-bold">{{ event.day }}</div>
          </div>
          <div class="event-details">
            <h3 matListItemTitle class="fw-semibold">{{ event.title }}</h3>
            <p matListItemLine class="text-secondary-emphasis mb-0">
              <mat-icon class="icon-small me-1">schedule</mat-icon>
              {{ event.time }} -
              <mat-icon class="icon-small me-1">location_on</mat-icon>
              {{ event.location }}
            </p>
          </div>
          <button mat-button color="accent" matListItemMeta>تفاصيل</button>
          <mat-divider></mat-divider>
        </mat-list-item>
      </mat-list>

      <div class="text-center mt-4">
        <button mat-stroked-button color="primary">
          عرض التقويم الكامل
          <mat-icon>calendar_today</mat-icon>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
