<app-page-wrapper
  headerTitle="قائمة السنوات الدراسية"
  headerSubtitle="تصفح جميع السنوات الدراسية المتوفرة في النظام"
  headerIcon="location_city"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="openYearDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    إضافة سنة
  </button>

  <app-table
    [dataRow]="years()"
    [columns]="Columns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
