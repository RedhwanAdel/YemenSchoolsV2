<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10 col-md-12">
      <mat-card class="attendance-card mat-elevation-z8">
        <mat-card-header>
          <div class="d-flex align-items-center">
            <mat-icon color="primary" class="me-3">how_to_reg</mat-icon>
            <div>
              <mat-card-title>تحضير الحضور اليومي</mat-card-title>
              <mat-card-subtitle>
                <b>{{ sectionName }}</b>
                <span class="ms-4"
                  >التاريخ: <b>{{ today | date : "longDate" }}</b></span
                >
              </mat-card-subtitle>
            </div>
          </div>
        </mat-card-header>

        <mat-card-content>
          <div *ngIf="isLoading" class="d-flex justify-content-center my-5">
            <mat-spinner></mat-spinner>
          </div>

          <div *ngIf="!isLoading && students.length > 0; else noStudents">
            <table mat-table [dataSource]="students" class="attendance-table">
              <ng-container matColumnDef="position">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element; let i = index">
                  {{ i + 1 }}
                </td>
              </ng-container>

              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>الاسم</th>
                <td mat-cell *matCellDef="let student">{{ student.name }}</td>
              </ng-container>

              <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>الحالة</th>
                <td mat-cell *matCellDef="let student">
                  <mat-button-toggle-group
                    [(ngModel)]="studentStatuses[student.id]"
                    aria-label="Student Status"
                  >
                    <mat-button-toggle [value]="0">حاضر</mat-button-toggle>
                    <mat-button-toggle [value]="1">غائب</mat-button-toggle>
                    <mat-button-toggle [value]="2">غائب بعذر</mat-button-toggle>
                    <mat-button-toggle [value]="3">متأخر</mat-button-toggle>
                  </mat-button-toggle-group>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
          </div>

          <ng-template #noStudents>
            <div class="alert alert-info text-center py-4 my-4" role="alert">
              لا يوجد طلاب في هذه الشعبة.
            </div>
          </ng-template>
        </mat-card-content>

        <mat-card-actions align="end">
          <button
            mat-raised-button
            color="primary"
            [disabled]="isLoading"
            (click)="submitAttendance()"
          >
            <mat-icon>save</mat-icon> حفظ الحضور
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
