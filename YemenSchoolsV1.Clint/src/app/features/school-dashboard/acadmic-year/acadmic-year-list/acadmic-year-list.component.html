<app-page-wrapper
  headerTitle="acadmic-year List"
  headerSubtitle="Explore acadmic-years within selected acadmic-years"
  headerIcon="map"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="openRegionDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    Add acadmic-year
  </button>
  <app-school-levels-selector />
  <app-table
    [dataRow]="acadmicYearService.acadmicYears()"
    [columns]="Columns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
