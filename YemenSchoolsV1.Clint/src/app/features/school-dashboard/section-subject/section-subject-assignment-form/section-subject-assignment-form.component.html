<h2 mat-dialog-title>{{ isEdit ? "Edit City" : "Add City" }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" mat-dialog-content class="pt-3">
  <app-select-input
    label="subject Id"
    [options]="subjects()"
    labelKey="name"
    valueKey="gradeSubjectId"
    formControlName="gradeSubjectId"
  />
  <app-select-input
    label="term Id"
    [options]="terms()"
    labelKey="name"
    valueKey="id"
    formControlName="termId"
  />
  <app-select-input
    label="teacer Id"
    [options]="teachrs()"
    labelKey="name"
    valueKey="id"
    formControlName="teacherId"
  />
</form>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="form.invalid"
    type="submit"
    (click)="submit()"
  >
    {{ isEdit ? "Update" : "Add" }}
  </button>
</mat-dialog-actions>
