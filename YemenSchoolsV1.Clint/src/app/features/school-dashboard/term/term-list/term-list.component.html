<app-page-wrapper
  headerTitle="Term List"
  headerSubtitle="Explore Terms within selected Terms"
  headerIcon="map"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="opentermDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    Add Term
  </button>

  <div class="col-12 col-lg-auto order-lg-3 my-2">
    <mat-form-field appearance="outline" class="">
      <mat-label>Year List</mat-label>
      <mat-select [(ngModel)]="selectedYear" (ngModelChange)="yearChange()">
        @for (dir of years(); track dir.id) {
        <mat-option [value]="dir.id">
          {{ dir.name }}
        </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <app-table
    [allowSerch]="false"
    [dataRow]="terms()"
    [columns]="Columns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
