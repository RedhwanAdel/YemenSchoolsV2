<app-page-wrapper
  headerTitle="قائمة الشعب"
  headerSubtitle="استعرض الشعب المرتبطة بالصفوف المختارة"
  headerIcon="map"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="openSectionDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    إضافة شعبة
  </button>

  <app-table
    [dataRow]="sections()"
    [columns]="Columns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
