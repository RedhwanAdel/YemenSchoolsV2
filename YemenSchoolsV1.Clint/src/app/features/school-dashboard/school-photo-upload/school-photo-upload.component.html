<mat-card>
  <mat-card-title>Upload School Photos</mat-card-title>
  <mat-card-content>
    <input
      type="file"
      (change)="onFileSelected($event)"
      multiple
      accept="image/*"
    />

    <div *ngFor="let f of selectedFiles" class="upload-item">
      <span>{{ f.file.name }}</span>
      <mat-progress-bar
        mode="determinate"
        [value]="f.progress"
      ></mat-progress-bar>
    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="uploadPhotos()"
      [disabled]="selectedFiles.length === 0"
    >
      Upload All
    </button>
  </mat-card-content>
</mat-card>

<div class="uploaded-photos" *ngIf="uploadedPhotos.length > 0">
  <h3>Uploaded Photos:</h3>
  <div class="photo-item" *ngFor="let photo of uploadedPhotos">
    <img [src]="photo.photoUrl" alt="School Photo" />
    <button mat-icon-button color="warn" (click)="deletePhoto(photo)">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
