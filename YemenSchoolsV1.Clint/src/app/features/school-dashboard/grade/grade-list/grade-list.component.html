<app-page-wrapper
  headerTitle="Grade List"
  headerSubtitle="Explore Grades within selected Grades"
  headerIcon="map"
>
  <button
    card-actions
    color="primary"
    mat-flat-button
    (click)="openRegionDialog()"
  >
    <i class="bi bi-plus-lg me-1"></i>
    Add Grade
  </button>

  <app-table
    [dataRow]="gradeService.grades()"
    [columns]="Columns"
    [hasActions]="true"
    (actionClicked)="handleUserAction($event)"
    [usePaginator]="false"
    [actions]="actions"
  ></app-table>
</app-page-wrapper>
