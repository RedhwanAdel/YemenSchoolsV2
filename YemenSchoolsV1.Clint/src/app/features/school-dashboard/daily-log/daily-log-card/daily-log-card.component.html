<article class="card">
  <header class="card__header">
    <div class="icon">📚</div>
    <h2 class="card__title">
      {{ sectionSubject.subjectName }} — {{ sectionSubject.gradeName }} (شعبة
      {{ sectionSubject.sectionName }})
    </h2>
  </header>

  <div class="card__body">
    <div class="chips">
      <span class="chip">2024–2025</span>
    </div>
  </div>

  <div class="card__actions">
    <button class="btn btn--primary" (click)="openAddDailyLog()">
      ➕ إضافة سجل يومي
    </button>
    <button class="btn btn--ghost" (click)="openViewDailyLogs()">
      📄 عرض السجلات
    </button>
  </div>
</article>
