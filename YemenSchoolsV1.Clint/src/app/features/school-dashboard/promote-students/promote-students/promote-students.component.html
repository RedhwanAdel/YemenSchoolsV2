<mat-card>
  <mat-card-header>
    <mat-card-title>قائمة الطلاب في الشعبة الحالية</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="table-container">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox
              (change)="$event ? masterToggle() : null"
              [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()"
            >
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)"
            >
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="nameAr">
          <th mat-header-cell *matHeaderCellDef>الاسم</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="registerNo">
          <th mat-header-cell *matHeaderCellDef>رقم التسجيل</th>
          <td mat-cell *matCellDef="let element">{{ element.registerNo }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          (click)="selection.toggle(row)"
        ></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
<mat-card>
  <mat-card-content>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>اختر السنة الأكاديمية</mat-label>
      <mat-select
        [formControl]="academicYearCtrl"
        (selectionChange)="onAcademicYearSelected()"
      >
        <mat-option *ngFor="let year of academicYears" [value]="year.id">
          {{ year.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field
      appearance="fill"
      class="full-width"
      style="margin-top: 10px"
    >
      <mat-label> اختر الشعبة الجديدة</mat-label>
      <mat-select [formControl]="newSectionCtrl">
        <mat-option
          *ngFor="let section of newSections"
          [value]="section.sectionId"
        >
          {{ section.gradeName }} - {{ section.sectionName }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-card-content>
</mat-card>

<div style="margin-top: 20px; text-align: center">
  <button
    mat-raised-button
    color="primary"
    [disabled]="selection.isEmpty() || !newSectionCtrl.value"
    (click)="promoteStudents()"
  >
    ترقية الطلاب المحددين
  </button>
</div>
