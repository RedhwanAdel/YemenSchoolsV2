<div class="sidebar-header">
  <!-- زر الإغلاق للشاشات الصغيرة -->
  <div
    *ngIf="isMobileView"
    class="sidebar-close-btn d-flex justify-content-end w-100 p-2"
  >
    <button
      mat-icon-button
      (click)="closeSidebar.emit()"
      aria-label="إغلاق القائمة الجانبية"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <img
    src="assets/images/logo/yemenlogo.png"
    alt="شعار التطبيق"
    class="sidebar-logo"
  />
  <!-- <h3 class="sidebar-title">اسم التطبيق</h3> -->
</div>

<mat-divider></mat-divider>

<mat-nav-list class="sidebar-nav-list">
  <a mat-list-item routerLink="/">
    <mat-icon matListItemIcon>home</mat-icon>
    <span matListItemTitle>الرئيسية</span>
  </a>

  <!-- لوحة التحكم -->
  <a mat-list-item routerLink="/dash-board/" routerLinkActive="active-link">
    <mat-icon matListItemIcon>dashboard</mat-icon>
    <span matListItemTitle>لوحة التحكم</span>
  </a>

  <!-- المدن -->
  <a
    mat-list-item
    routerLink="/dash-board/cities"
    routerLinkActive="active-link"
  >
    <mat-icon matListItemIcon>location_city</mat-icon>
    <span matListItemTitle>المدن</span>
  </a>

  <!-- المناطق -->
  <a
    mat-list-item
    routerLink="/dash-board/regions"
    routerLinkActive="active-link"
  >
    <mat-icon matListItemIcon>location_city</mat-icon>
    <span matListItemTitle>المناطق</span>
  </a>

  <!-- المدارس -->
  <a
    mat-list-item
    routerLink="/dash-board/schools"
    routerLinkActive="active-link"
  >
    <mat-icon matListItemIcon>school</mat-icon>
    <span matListItemTitle>المدارس</span>
  </a>

  <mat-divider></mat-divider>

  <!-- الإعدادات -->
  <a mat-list-item routerLink="/settings" routerLinkActive="active-link">
    <mat-icon matListItemIcon>settings</mat-icon>
    <span matListItemTitle>الإعدادات</span>
  </a>

  <!-- المساعدة -->
  <a mat-list-item routerLink="/help" routerLinkActive="active-link">
    <mat-icon matListItemIcon>help_outline</mat-icon>
    <span matListItemTitle>مساعدة</span>
  </a>
</mat-nav-list>
