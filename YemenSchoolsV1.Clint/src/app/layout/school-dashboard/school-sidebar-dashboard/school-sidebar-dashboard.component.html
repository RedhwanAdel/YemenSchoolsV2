<div class="sidebar-header">
  <!-- Close button for small screens -->
  <div
    *ngIf="isMobileView"
    class="sidebar-close-btn d-flex justify-content-end w-100 p-2"
  >
    <button
      mat-icon-button
      (click)="closeSidebar.emit()"
      aria-label="Close sidebar"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <img
    src="https://placehold.co/80x80/aabbcc/ffffff?text=Logo"
    alt="App Logo"
    class="sidebar-logo"
  />
  <h3 class="sidebar-title">لوحة الإعدادات</h3>
</div>

<mat-divider></mat-divider>

<mat-nav-list class="sidebar-nav-list">
  <a mat-list-item routerLink="/">
    <mat-icon matListItemIcon>home</mat-icon>
    <span matListItemTitle>الرئيسية</span>
  </a>

  <a
    mat-list-item
    routerLink="/school-dash-board/school-grade"
    routerLinkActive="active-link"
  >
    <mat-icon matListItemIcon>location_city</mat-icon>
    <span matListItemTitle>إدارة الصفوف والمراحل</span>
  </a>

  <a
    mat-list-item
    routerLink="/school-dash-board/school-subject"
    routerLinkActive="active-link"
  >
    <mat-icon matListItemIcon>location_city</mat-icon>
    <span matListItemTitle>إدارة المواد الدراسية</span>
  </a>
</mat-nav-list>
