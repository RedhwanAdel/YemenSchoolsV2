<header id="header" class="header d-flex align-items-center fixed-top">
  <div
    class="container position-relative d-flex align-items-center justify-content-between"
  >
    <a routerLink="/" class="logo d-flex align-items-center me-auto me-xl-0">
      <h1 class="sitename">مدارس اليمن</h1>
      <span>.</span>
    </a>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >الرئيسية</a
          >
        </li>
        <li><a routerLink="/schools" routerLinkActive="active">المدارس</a></li>
        <li>
          <a routerLink="/school-details" routerLinkActive="active"
            >تفاصيل المدرسة</a
          >
        </li>
        <li><a routerLink="/dash-board">لوحة التحكم</a></li>
        <li><a routerLink="/school-dash-board">لوحة تحكم المدرسة</a></li>
        <li><a routerLink="/parent-dash-board">لوحة تحكم اولياء الأمور</a></li>
        <li>
          <a routerLink="/test-error" routerLinkActive="active">اختبار الخطأ</a>
        </li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>
    <div class="d-flex align-items-center gap-3">
      @if (accountService.currentUser()) {

      <!-- قائمة المستخدم -->
      <button
        mat-button
        [matMenuTriggerFor]="userMenu"
        class="user-menu-button d-flex align-items-center bg-transparent border-0"
      >
        <mat-icon class="me-1">person</mat-icon>
        <span class="user-name me-1">{{
          accountService.currentUser()?.firstName
        }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      } @else {
      <!-- روابط التسجيل وتسجيل الدخول -->
      <div class="gap-3 d-flex">
        <a class="btn-getstarted me-2 p-2" routerLink="/register">تسجيل</a>
        <a class="btn-getstarted p-2" routerLink="/login">تسجيل الدخول</a>
      </div>
      }
    </div>

    <!-- قائمة منسدلة -->
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>account_circle</mat-icon>
        <span>الملف الشخصي</span>
      </button>
      <button mat-menu-item>
        <mat-icon>settings</mat-icon>
        <span>الإعدادات</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>تسجيل خروج</span>
      </button>
    </mat-menu>
  </div>
</header>
